name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  checks:
    name: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release-notes.mjs "$RELEASE_VERSION" release-notes.md
      - name: Verify application version
        run: node -e "const { version } = require('./packages/web/version.json'); if (version !== process.env.RELEASE_VERSION) throw new Error('version.json must match the release version.');"
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  windows:
    name: Windows x64
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare desktop Google credentials
        env:
          GOOGLE_DESKTOP_CREDENTIALS_JSON: ${{ secrets.GOOGLE_DESKTOP_CREDENTIALS_JSON }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_DESKTOP_CREDENTIALS_JSON)) {
            throw 'GOOGLE_DESKTOP_CREDENTIALS_JSON is required.'
          }
          $google = Join-Path $env:RUNNER_TEMP 'google-oauth-client.json'
          [IO.File]::WriteAllText($google, $env:GOOGLE_DESKTOP_CREDENTIALS_JSON)
          "GOOGLE_DESKTOP_CREDENTIALS_PATH=$google" >> $env:GITHUB_ENV
      - run: pnpm turbo build --filter=@schdk/desktop
      - name: Package unsigned installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: >
          pnpm --filter @schdk/desktop package:win
          --config.extraMetadata.version=$env:RELEASE_VERSION
          --config.win.target=nsis
      - name: Verify
        run: |
          $asset = "packages/desktop/dist/release/schdk-$env:RELEASE_VERSION-windows-x64-installer.exe"
          if (!(Test-Path -LiteralPath $asset)) {
            throw "Missing release asset: $asset"
          }
          if ((Get-Item -LiteralPath $asset).Length -eq 0) {
            throw "Empty release asset: $asset"
          }
          $signature = Get-AuthenticodeSignature -FilePath $asset
          if ($signature.Status -ne 'NotSigned') {
            throw "Expected unsigned release asset, got: $($signature.Status)"
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x64-installer
          path: packages/desktop/dist/release/schdk-${{ inputs.version }}-windows-x64-installer.exe
          if-no-files-found: error
      - name: Remove desktop Google credentials
        if: always()
        run: |
          if ($env:GOOGLE_DESKTOP_CREDENTIALS_PATH) {
            Remove-Item -LiteralPath $env:GOOGLE_DESKTOP_CREDENTIALS_PATH -Force -ErrorAction SilentlyContinue
          }

  publish:
    name: Publish GitHub Release
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-windows-x64-installer
          path: release-assets
      - run: node scripts/release-notes.mjs "$RELEASE_VERSION" release-notes.md
      - name: Verify release assets
        shell: bash
        run: |
          asset="release-assets/schdk-$RELEASE_VERSION-windows-x64-installer.exe"
          test -s "$asset"
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v$RELEASE_VERSION"
          release-assets/*
          --target "$GITHUB_SHA"
          --title "ЩДК v$RELEASE_VERSION"
          --notes-file release-notes.md
