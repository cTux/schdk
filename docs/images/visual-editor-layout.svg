<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Proposed SCHDK visual editor layout</title>
  <desc id="description">A dark shell sidebar, labeled add panel, light workspace, compact floating action bar, and centered game canvas with editable elements.</desc>
  <defs>
    <radialGradient id="workspace" cx="62%" cy="42%" r="72%">
      <stop offset="0" stop-color="#fff8e9"/>
      <stop offset=".48" stop-color="#f5f3ef"/>
      <stop offset="1" stop-color="#e9edf3"/>
    </radialGradient>
    <radialGradient id="game" cx="50%" cy="32%" r="70%">
      <stop offset="0" stop-color="#263143"/>
      <stop offset="1" stop-color="#0d1015"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#111827" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="1280" height="720" rx="22" fill="#101216"/>

  <g font-family="Segoe UI, sans-serif">
    <rect x="16" y="16" width="180" height="688" rx="16" fill="#171a20"/>
    <circle cx="48" cy="52" r="18" fill="#e9ad45"/>
    <text x="78" y="48" fill="#eef1f5" font-size="14" font-weight="700">ЩДК</text>
    <text x="78" y="66" fill="#929aa8" font-size="11">Інструменти</text>

    <g fill="#aab1bd" font-size="12">
      <rect x="28" y="102" width="156" height="42" rx="10" fill="#21252d"/>
      <circle cx="50" cy="123" r="8" fill="#5c6573"/>
      <text x="70" y="128">Провести гру</text>
      <rect x="28" y="150" width="156" height="42" rx="10" fill="#21252d"/>
      <circle cx="50" cy="171" r="8" fill="#5c6573"/>
      <text x="70" y="176">Питання</text>
      <rect x="28" y="198" width="156" height="42" rx="10" fill="#e9ad45" fill-opacity=".15"/>
      <circle cx="50" cy="219" r="8" fill="#e9ad45"/>
      <text x="70" y="224" fill="#f2c36f">Візуальний редактор</text>
    </g>

    <rect x="212" y="16" width="180" height="688" rx="16" fill="#f8f7f4"/>
    <text x="236" y="57" fill="#171a20" font-size="16" font-weight="700">Додати</text>
    <text x="236" y="78" fill="#697180" font-size="11">Елементи екрана гри</text>

    <g>
      <rect x="228" y="104" width="148" height="70" rx="12" fill="#fff" stroke="#d9dde5"/>
      <text x="248" y="142" fill="#285fb8" font-size="22" font-weight="700">T</text>
      <text x="283" y="143" fill="#232832" font-size="13" font-weight="600">Текст</text>

      <rect x="228" y="186" width="148" height="70" rx="12" fill="#fff" stroke="#d9dde5"/>
      <rect x="247" y="210" width="23" height="20" rx="3" fill="none" stroke="#285fb8" stroke-width="2"/>
      <path d="m250 227 6-7 4 4 4-5 4 8" fill="none" stroke="#285fb8" stroke-width="2"/>
      <text x="283" y="226" fill="#232832" font-size="13" font-weight="600">Зображення</text>
    </g>

    <rect x="408" y="16" width="856" height="688" rx="16" fill="url(#workspace)"/>

    <g filter="url(#shadow)">
      <rect x="670" y="48" width="330" height="48" rx="14" fill="#22262e"/>
      <g fill="#eef1f5" stroke="#eef1f5" stroke-width="2">
        <path d="m700 62 14 8-7 3-3 8z" fill="none"/>
        <line x1="747" y1="65" x2="747" y2="80"/>
        <line x1="740" y1="72.5" x2="754" y2="72.5"/>
        <circle cx="790" cy="72" r="7" fill="none"/>
        <path d="m833 65v15m-7-7h14" fill="none"/>
        <rect x="868" y="65" width="15" height="14" rx="2" fill="none"/>
        <path d="m915 65 15 15m-15 0 15-15" fill="none"/>
        <circle cx="969" cy="72" r="2"/>
        <circle cx="977" cy="72" r="2"/>
        <circle cx="985" cy="72" r="2"/>
      </g>
      <g stroke="#444b57">
        <line x1="729" y1="58" x2="729" y2="86"/>
        <line x1="812" y1="58" x2="812" y2="86"/>
        <line x1="852" y1="58" x2="852" y2="86"/>
        <line x1="900" y1="58" x2="900" y2="86"/>
        <line x1="946" y1="58" x2="946" y2="86"/>
      </g>
    </g>

    <g filter="url(#shadow)">
      <path d="M744 105h90l-10-9h-70z" fill="#22262e"/>
      <rect x="738" y="103" width="102" height="30" rx="8" fill="#22262e"/>
      <text x="752" y="123" fill="#f4f5f7" font-size="11">Змінити текст</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="486" y="154" width="700" height="394" rx="18" fill="url(#game)" stroke="#3b424e" stroke-width="2"/>
      <circle cx="526" cy="190" r="17" fill="#e9ad45"/>
      <text x="553" y="193" fill="#b9c0cd" font-size="11">1 / 36</text>

      <rect x="546" y="229" width="360" height="78" rx="10" fill="#141922" stroke="#2d3440"/>
      <text x="726" y="262" fill="#f1f3f6" font-size="19" text-anchor="middle">Текст питання</text>
      <text x="726" y="285" fill="#929aa8" font-size="11" text-anchor="middle">Спільний ігровий компонент</text>

      <rect x="948" y="215" width="160" height="118" rx="9" fill="#222a35" stroke="#3b4655"/>
      <path d="m970 303 36-41 26 25 24-34 31 50" fill="none" stroke="#7f8da1" stroke-width="5"/>
      <circle cx="1060" cy="246" r="9" fill="#e9ad45" fill-opacity=".7"/>

      <rect x="618" y="348" width="310" height="68" rx="8" fill="#172337" stroke="#69a9ff" stroke-width="2"/>
      <rect x="612" y="342" width="12" height="12" fill="#69a9ff"/>
      <rect x="922" y="342" width="12" height="12" fill="#69a9ff"/>
      <rect x="612" y="410" width="12" height="12" fill="#69a9ff"/>
      <rect x="922" y="410" width="12" height="12" fill="#69a9ff"/>
      <text x="773" y="389" fill="#fff" font-size="24" text-anchor="middle">Власний текст</text>

      <rect x="977" y="372" width="126" height="96" rx="8" fill="#161b23" stroke="#596474" stroke-dasharray="6 5"/>
      <rect x="1024" y="400" width="32" height="28" rx="4" fill="none" stroke="#929aa8" stroke-width="2"/>
      <path d="m1028 424 9-10 6 6 6-8 5 12" fill="none" stroke="#929aa8" stroke-width="2"/>
      <text x="1040" y="451" fill="#929aa8" font-size="10" text-anchor="middle">Додати файл</text>

      <rect x="528" y="461" width="112" height="48" rx="10" fill="#141922"/>
      <text x="584" y="491" fill="#efad3f" font-size="20" text-anchor="middle">00:42</text>
      <rect x="896" y="482" width="232" height="42" rx="10" fill="#31291d"/>
      <text x="1012" y="509" fill="#efad3f" font-size="16" text-anchor="middle">Відповідь</text>
    </g>

    <g fill="#626c7b" font-size="11">
      <circle cx="520" cy="627" r="4" fill="#69a9ff"/>
      <text x="533" y="631">Виділення та фокус</text>
      <circle cx="687" cy="627" r="4" fill="#e9ad45"/>
      <text x="700" y="631">Основна дія</text>
      <rect x="816" y="622" width="15" height="10" rx="3" fill="#22262e"/>
      <text x="840" y="631">Контекстна панель</text>
    </g>
  </g>
</svg>
